[project]
name = "agenticai-marketing"
version = "2.0.0"
description = "Companion code for 'Mastering Agentic AI for Customer Journey Marketing' by Pushparajan Ramar"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pushparajan Ramar" }]

dependencies = [
    # LLM SDKs
    "openai>=1.30",
    "openai-agents>=0.1",
    "anthropic>=0.30",
    "google-generativeai>=0.7",

    # Agent Frameworks
    "crewai==0.130.0",
    "langgraph>=0.3",
    "pyautogen>=0.4",
    "mcp>=1.0",

    # MarTech SDKs
    "hubspot-api-client>=9.0",
    "klaviyo-api>=9.0",

    # Data & Validation
    "pydantic>=2",
    "pyyaml>=6.0",
    "pandas>=2.0",

    # Web & UI
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "gradio>=4.0",

    # Utilities
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipywidgets>=8.0",
    "matplotlib>=3.8",
]
snowflake = [
    "snowflake-connector-python>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
