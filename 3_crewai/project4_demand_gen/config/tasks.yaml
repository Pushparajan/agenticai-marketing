# tasks.yaml
# Project 4: Demand Gen Pipeline Crew
# Chapter Reference: Chapter 4 – CrewAI Framework
# Book: "Mastering Agentic AI for Marketing Technology" by Pushparajan Ramar
# Description: Hierarchical task definitions managed by a manager LLM

analyze_segments_task:
  description: >
    Analyze the target segment "{segment_name}" for the upcoming demand
    generation campaign.

    Steps:
    1. Export the audience cohort from the CDP using the segment name.
    2. Score the cohort's purchase propensity using ML models.
    3. Summarize the cohort profile: size, propensity distribution,
       top firmographic traits, and recommended sub-segments.

    Budget context: ${budget} across {channels}.
    Campaign timeline: {timeline}.
  expected_output: >
    A JSON object with keys:
      - cohort_id (str): the exported cohort identifier
      - cohort_size (int): number of contacts in the cohort
      - propensity_summary (dict): min, max, mean, median scores
      - top_segments (list): up to 3 recommended sub-segments with names
        and sizes
      - recommendations (str): plain-text analyst commentary
  agent: segment_analyst

design_campaign_task:
  description: >
    Using the audience analysis from the Segment Analyst, design a
    multi-channel demand generation campaign.

    Requirements:
    - Total budget: ${budget}
    - Channels to consider: {channels}
    - Timeline: {timeline}
    - Target segment: "{segment_name}"

    Deliverables:
    1. Channel mix with percentage budget allocation and rationale.
    2. Messaging themes per channel (1-2 sentences each).
    3. Funnel stage mapping: which channels serve TOF, MOF, BOF.
    4. KPI targets per channel (impressions, clicks, leads, CPL).
    5. Week-by-week execution timeline.
  expected_output: >
    A JSON object with keys:
      - campaign_name (str)
      - channel_mix (list of dicts): channel, budget_pct, budget_usd,
        funnel_stage, messaging_theme
      - kpi_targets (dict): channel-level metrics
      - timeline (list of dicts): week, activities
      - total_expected_leads (int)
      - projected_cpl (float)
  agent: campaign_strategist
  context:
    - analyze_segments_task

generate_copy_task:
  description: >
    Write all campaign copy assets based on the Campaign Strategist's plan.

    Produce:
    1. A 3-email nurture sequence (subject, preview text, body HTML outline,
       CTA) targeting the "{segment_name}" segment.
    2. Two Google Ads responsive search ad variants (headlines x15,
       descriptions x4 each).
    3. One landing page content block (headline, sub-headline, 3 bullet
       points, CTA button text, social proof line).

    All copy must:
    - Reference the propensity insights and segment traits.
    - Align with the messaging themes from the campaign plan.
    - Be formatted as structured JSON for direct platform ingestion.
  expected_output: >
    A JSON object with keys:
      - email_sequence (list of 3 dicts): step, subject, preview_text,
        body_outline, cta
      - google_ads (list of 2 dicts): variant, headlines (list),
        descriptions (list)
      - landing_page (dict): headline, sub_headline, bullets (list),
        cta_text, social_proof
  agent: copy_generator
  context:
    - analyze_segments_task
    - design_campaign_task

publish_campaign_task:
  description: >
    Activate the full demand generation campaign across all platforms.

    Using the campaign plan and copy assets:
    1. Activate a HubSpot workflow for the email nurture sequence
       targeting the exported cohort.
    2. Create a Klaviyo email flow with the 3-email sequence, triggered
       by the appropriate event.
    3. Push the audience cohort to Google Ads as a customer match list.
    4. Log every activation action with timestamp and confirmation ID.

    Cohort ID from analysis: use the cohort_id from the Segment Analyst.
    Campaign name from strategy: use the campaign_name from the Strategist.
  expected_output: >
    A JSON object with keys:
      - activations (list of dicts): platform, action, status,
        confirmation_id, timestamp
      - summary (str): plain-text summary of what was activated
      - all_platforms_live (bool): true if every activation succeeded
  agent: campaign_publisher
  context:
    - analyze_segments_task
    - design_campaign_task
    - generate_copy_task
