# ---------------------------------------------------------------------------
# Buyer Persona Definition
# ---------------------------------------------------------------------------
buyer_persona:
  name: "Sarah Chen"
  title: "VP of Marketing"
  industry: "B2B SaaS"
  company_name: "GrowthLoop Technologies"
  company_size: "200-500 employees"
  annual_revenue: "$20M-$50M"
  decision_authority: "Final decision maker for MarTech stack"

  tech_stack:
    - "Salesforce CRM"
    - "Google Analytics"
    - "Mailchimp"
    - "WordPress"

  pain_points:
    - "Fragmented customer data across 8+ tools with no unified view"
    - "Manual lead scoring takes 15+ hours per week"
    - "Campaign attribution is unreliable — cannot prove ROI to the board"
    - "Sales and marketing teams are misaligned on lead quality"
    - "Customer churn is rising but root causes are unclear"

  goals:
    - "Unify customer data into a single source of truth"
    - "Automate lead scoring and routing to save 60% of manual effort"
    - "Achieve accurate multi-touch attribution across all channels"
    - "Reduce customer churn by 25% through predictive analytics"
    - "Demonstrate clear marketing ROI to executive leadership"

  preferred_channels:
    - "Email"
    - "LinkedIn"
    - "Webinars"
    - "In-person conferences"

  preferred_communication: "Data-driven, concise, ROI-focused"
  budget_authority: true
  decision_timeline: "Q2 2026"

  objections:
    - "We have tried similar platforms before and adoption was low"
    - "Integration with our existing Salesforce setup is a concern"
    - "Budget approval requires a detailed ROI projection"
    - "Our team lacks the technical skills for complex AI tools"

# ---------------------------------------------------------------------------
# Customer Journey Stages
# ---------------------------------------------------------------------------
journey_stages:
  - stage: "Awareness"
    description: "Prospect discovers the brand through content or ads"
    typical_actions:
      - "Visits blog post or whitepaper landing page"
      - "Clicks on a LinkedIn ad"
      - "Attends an industry webinar"
    kpis:
      - "Page views"
      - "Ad click-through rate"
      - "Webinar registrations"

  - stage: "Consideration"
    description: "Prospect evaluates the product against alternatives"
    typical_actions:
      - "Downloads a case study or comparison guide"
      - "Watches a product demo video"
      - "Engages with email nurture sequence"
    kpis:
      - "Content downloads"
      - "Demo video completion rate"
      - "Email open and click rates"

  - stage: "Decision"
    description: "Prospect requests pricing, demo, or trial"
    typical_actions:
      - "Requests a live product demo"
      - "Asks for custom pricing"
      - "Starts a free trial"
    kpis:
      - "Demo requests"
      - "Trial sign-ups"
      - "Proposal requests"

  - stage: "Purchase"
    description: "Prospect converts to a paying customer"
    typical_actions:
      - "Signs the contract"
      - "Completes onboarding"
      - "Integrates with existing tools"
    kpis:
      - "Conversion rate"
      - "Time to close"
      - "Deal size"

  - stage: "Retention"
    description: "Customer continues using and expanding the product"
    typical_actions:
      - "Adopts new features"
      - "Attends customer success check-ins"
      - "Refers colleagues or peers"
    kpis:
      - "Net Promoter Score"
      - "Feature adoption rate"
      - "Renewal rate"

# ---------------------------------------------------------------------------
# Product Catalog
# ---------------------------------------------------------------------------
product_catalog:
  - sku: "CDP-PRO-001"
    name: "MarketFlow CDP Pro"
    category: "Customer Data Platform"
    description: >
      Unified customer data platform that consolidates data from 50+
      sources into a single real-time profile. Includes identity resolution,
      audience segmentation, and data activation across all channels.
    price_range: "$2,500 - $8,000/month"
    ideal_for: "Mid-market B2B companies with fragmented data stacks"
    key_features:
      - "Real-time identity resolution across devices and channels"
      - "Pre-built connectors for Salesforce, HubSpot, Marketo, and 50+ tools"
      - "AI-powered audience segmentation"
      - "GDPR and CCPA compliance built-in"

  - sku: "AI-SCORE-002"
    name: "LeadIQ AI Scoring"
    category: "AI Lead Scoring"
    description: >
      Machine learning powered lead scoring engine that analyzes behavioral,
      firmographic, and intent signals to rank leads by purchase readiness.
    price_range: "$1,200 - $4,500/month"
    ideal_for: "Sales and marketing teams drowning in unqualified leads"
    key_features:
      - "Predictive scoring using 100+ behavioral signals"
      - "Automatic lead routing based on score thresholds"
      - "Integration with Salesforce, HubSpot, and Outreach"
      - "Weekly model retraining for accuracy improvement"

  - sku: "ATTR-360-003"
    name: "Attribution360"
    category: "Marketing Attribution"
    description: >
      Multi-touch attribution platform that tracks every customer
      interaction from first touch to closed deal, providing clear
      ROI measurement for every marketing dollar spent.
    price_range: "$1,800 - $6,000/month"
    ideal_for: "Marketing leaders who need to prove ROI to the C-suite"
    key_features:
      - "Multi-touch attribution models (linear, time-decay, data-driven)"
      - "Cross-channel journey visualization"
      - "Revenue impact reporting by campaign and channel"
      - "Board-ready executive dashboards"

  - sku: "BUNDLE-ENT-004"
    name: "MarketFlow Enterprise Suite"
    category: "Full Platform Bundle"
    description: >
      Complete marketing intelligence platform combining CDP, AI scoring,
      and attribution into one integrated solution with dedicated support.
    price_range: "$5,000 - $15,000/month"
    ideal_for: "Enterprise teams seeking a unified MarTech platform"
    key_features:
      - "All features from CDP Pro, LeadIQ, and Attribution360"
      - "Dedicated customer success manager"
      - "Custom API integrations and data warehouse sync"
      - "Quarterly business reviews and strategy sessions"

# ---------------------------------------------------------------------------
# Brand Voice Guidelines
# ---------------------------------------------------------------------------
brand_voice:
  tone: "Professional, consultative, empathetic"
  vocabulary:
    preferred:
      - "empower"
      - "streamline"
      - "data-driven insights"
      - "unified view"
      - "actionable intelligence"
    forbidden:
      - "cheap"
      - "crush the competition"
      - "no-brainer"
      - "guaranteed results"
      - "buy now"
  prohibited_phrases:
    - "cheap"
    - "crush the competition"
    - "no-brainer"
    - "guaranteed results"
    - "buy now"
    - "act fast"
    - "limited time offer"
    - "you'd be crazy not to"
    - "trust me"
  guidelines:
    - "Always lead with value, not features"
    - "Acknowledge pain points before offering solutions"
    - "Use data and case studies to support claims"
    - "Never pressure the prospect — guide them"
    - "Maintain a consultative, advisory tone throughout"
    - "Never disparage competitors by name"
